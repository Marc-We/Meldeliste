<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meldeliste</title>
  <style>
    body {
      margin: 0;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: #f7f9fc;
      color: #1a2233;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      width: min(560px, 100%);
      background: #ffffff;
      border: 1px solid #dbe1ea;
      border-radius: 14px;
      padding: 24px;
      box-shadow: 0 1px 3px rgba(20,34,60,0.06);
    }
    h1 { margin: 0 0 12px; }
    p { margin: 0 0 14px; color: #5a6478; }
    a {
      display: block;
      margin: 8px 0;
      padding: 12px 14px;
      border-radius: 10px;
      text-decoration: none;
      font-weight: 700;
      background: #2563c9;
      color: #ffffff;
      text-align: center;
    }
    a.secondary {
      background: #ffffff;
      color: #1a2233;
      border: 1px solid #c7d0dd;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Meldeliste</h1>
    <p>Wähle die Ansicht, die du öffnen möchtest.</p>
    <a href="/dashboard.html">Lehrer-Dashboard</a>
    <a class="secondary" href="/client.html">Schüler-Client</a>
  </div>
</body>
</html>
